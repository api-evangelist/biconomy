- aid: biconomy:biconomy-dashboard-public-api
  name: Biconomy Dashboard Public API
  humanURL: https://docs.biconomy.io/overview/supertransaction-api/history-and-costs
  baseURL: https://dashboard.biconomy.io
  tags:
  - MEE
  - Reporting
  - Cost Accounting
  - Account Abstraction
  properties:
  - type: Documentation
    url: https://docs.biconomy.io/overview/supertransaction-api/history-and-costs
  - type: Authentication
    url: authentication/biconomy-authentication.yml
  - type: Conventions
    url: conventions/biconomy-conventions.yml
  description: >-
    GET /api/public/projects/me/supertransactions returns a project's full supertransaction
    history for reporting, reconciliation and gas-spend accounting. Each item carries the
    supertransaction hash, execution status, chain ids and payment details (fee token, gas fee,
    amounts). Authenticated with the project API key in a lowercase x-api-key header. This is the
    only Biconomy surface with a collection and the only one with pagination: query parameters
    lowerBound, upperBound, executedOnly, limit, cursor and before drive cursor pagination, and
    responses carry a pagination object of {limit, hasNextPage, nextCursor}. It appears in no
    published OpenAPI — it is documented only in prose at the history-and-costs page — so it is
    registered here as a documented-but-unspecified surface.
- aid: biconomy:biconomy-mee-explorer-api
  name: Biconomy MEE Explorer API
  humanURL: https://docs.biconomy.io/overview/supertransaction-api/execute
  baseURL: https://network.biconomy.io
  tags:
