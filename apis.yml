    type: SDKs
  description: >-
    AbstractJS (@biconomy/abstractjs) is Biconomy's TypeScript-first SDK with a Viem-inspired API. Wraps
    the Supertransaction API and Nexus smart account operations, exposing createMeeClient, getQuote, executeQuote,
    and waitForSupertransactionReceipt helpers, plus composable instruction builders for cross-chain orchestration,
    conditional execution, runtime balance injection, and cleanup.
