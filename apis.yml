    type: Documentation
  - url: https://github.com/bcnmy/session-permissioned-intents
    type: SourceCode
  description: >-
    Smart Sessions is a delegated-execution framework layered on Nexus. A session key is granted a scoped
    set of policies (Sudo, Universal Action, Time Range, Usage Limit) that bound what an agent or automation
    can execute on behalf of the owner. Intended for agents, recurring automations, and intent-flow access
    without re-prompting the owner for every transaction.
