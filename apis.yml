  - type: Explorer
    url: https://meescan.biconomy.io
  description: >-
    Status and tracking surface for a submitted supertransaction. GET /v1/explorer/{supertxHash}
    returns the terminal execution state (SUCCESS, FAILED) with execution details, authenticated
    with the same dashboard-issued key sent as an Authorization Bearer token rather than in
    X-API-Key. It is the necessary companion to POST /v1/execute, whose 200 means accepted rather
    than completed. Recorded here because it is a distinct host and a distinct auth convention
    from api.biconomy.io, and because it is documented only in llms.txt and the execute guide —
    it appears in no published OpenAPI. Probed unauthenticated 2026-08-24: HTTP 401 with
    {"errors":["API key required..."]}, which confirms the host and the gate but leaves the
    response schema unmeasured. The human-readable equivalent is https://meescan.biconomy.io.
name: Biconomy
created: '2026-05-25'
modified: '2026-08-24'
description: >-
  Biconomy is the onchain orchestration layer for multi-chain applications, founded in 2019 and
  headquartered in Singapore. Its Modular Execution Environment (MEE) composes multi-step,
  cross-chain blockchain workflows — swaps, bridges, DeFi vault deposits, arbitrary contract calls
  — into a single user signature across 20+ EVM mainnets, handling sequencing, runtime parameter
  injection, bridge timing, gas abstraction, simulation-based async execution and failure recovery
  on the developer's behalf. The commercial surface is a REST Supertransaction API
  (POST /v1/quote, POST /v1/execute) plus the TypeScript AbstractJS SDK, both sitting on the same
  engine and the same project API key. Underneath, Biconomy ships open-source account-abstraction
  infrastructure: an ERC-4337 bundler, ERC-4337 paymasters for gas sponsorship and pay-in-token
  flows, and Nexus, an ERC-7579 modular smart account audited by Cyfrin, Spearbit, Zenith and
  Pashov. Smart Sessions layers scoped, time-limited, revocable on-chain delegation on top, which
  is how AI agents and automations transact on a user's behalf without holding their key. Biconomy
  also authored ERC-8211 for composable batching.
