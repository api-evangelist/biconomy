apis:
- aid: biconomy:biconomy-bundler-api
  name: Biconomy Bundler API
  tags:
  - Account Abstraction
  - ERC-4337
  - Bundler
  - UserOps
  humanURL: https://github.com/bcnmy/bundler
  properties:
  - url: https://github.com/bcnmy/bundler
    type: SourceCode
  - url: https://docs.biconomy.io/contracts-and-audits/supported-chains
    type: Documentation
  description: >-
    Biconomy's open-source ERC-4337 TypeScript Bundler. Implements eth_sendUserOperation, eth_estimateUserOperationGas,
    eth_getUserOperationByHash, eth_getUserOperationReceipt, and eth_supportedEntryPoints across both
    EntryPoint v0.6.0 and v0.7.0. Hosted bundler endpoints are issued per project from the Biconomy Dashboard.
- aid: biconomy:biconomy-sponsorship-paymaster
  name: Biconomy Sponsorship Paymaster
  tags:
  - Account Abstraction
  - ERC-4337
  - Paymaster
  - Gas Sponsorship
  - Gasless
  humanURL: https://docs.biconomy.io/gasless-apps/sponsorship
  properties:
  - url: https://docs.biconomy.io/gasless-apps
    type: Documentation
  - url: https://docs.biconomy.io/gasless-apps/sponsorship
    type: Documentation
  - url: https://docs.biconomy.io/gasless-apps/testnet-sponsorship
    type: Documentation
  - url: https://docs.biconomy.io/gasless-apps/pay-in-tokens
    type: Documentation
  - url: https://github.com/bcnmy/biconomy-paymasters
    type: SourceCode
  - url: https://dashboard.biconomy.io
    type: Dashboard
  description: >-
    ERC-4337 paymaster service that fronts gas on behalf of end users so dApps can offer gasless UX. Two
    modes — full sponsorship (developer pays gas, post-paid invoiced monthly) and pay-in-tokens (user
    pays gas in ERC-20). All sponsorship limits (per-tx USD cap, per-user daily cap, allowed contracts,
    chain whitelist) are configured per project in the Biconomy Dashboard and enforced before /v1/quote
    returns a sponsored quote.
- aid: biconomy:biconomy-nexus-smart-account
  name: Biconomy Nexus Smart Account
  tags:
  - Account Abstraction
  - ERC-4337
  - ERC-7579
  - Smart Accounts
  - Modules
  humanURL: https://github.com/bcnmy/nexus
  properties:
  - url: https://github.com/bcnmy/nexus
    type: SourceCode
  - url: https://github.com/bcnmy/nexus/wiki
    type: Documentation
  - url: https://docs.biconomy.io/contracts-and-audits
    type: Documentation
  - url: https://docs.biconomy.io/contracts-and-audits/supported-chains
    type: Documentation
  description: >-
    Nexus is Biconomy's ERC-7579 modular smart contract account, audited by CodeHawks-Cyfrin (Sept 2024),
    Spearbit (Oct/Nov 2024), Zenith (Mar 2025), and Pashov (Mar 2025), and pre-deployed across 20+ EVM
    mainnets. Supports the four ERC-7579 module types (validator, executor, hook, fallback) and is the
    underlying account implementation behind eoa-7702 mode of the MEE API.
- aid: biconomy:biconomy-smart-sessions-api
  name: Biconomy Smart Sessions API
  tags:
  - Account Abstraction
