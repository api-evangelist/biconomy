      additionalProperties: false
  - name: query_docs_filesystem_biconomy_docs
    category: documentation
    description: >-
      Read-only shell-like query against a virtualized, in-memory filesystem containing ONLY the
      Biconomy Docs pages and OpenAPI specs. Supports rg, tree, head and similar read commands.
      It is not a shell on any real machine.
    input_schema:
      type: object
      required: [command]
      properties:
        command:
          type: string
          description: >-
            A shell command to run against the virtualized documentation filesystem
            (e.g. `rg -il "keyword" /`, `tree / -L 2`, `head -80 /path/file.mdx`).
      additionalProperties: false
    note: >-
      This tool exposes the docs OpenAPI specs to an agent as files, which is a second,
      indirect discovery route to the Supertransaction contract.
  - name: submit_feedback
    title: Submit documentation feedback
    category: feedback
    description: >-
      Report a problem with a documentation page — incorrect, outdated, confusing, incomplete or
      a broken example — to the docs team.
    input_schema:
      type: object
      required: [path, feedback]
      properties:
        path:
          type: string
          minLength: 1
          description: The documentation page path the feedback is about.
        feedback:
          type: string
          minLength: 1
          description: A clear description of the documentation issue or suggestion.
      additionalProperties: false
