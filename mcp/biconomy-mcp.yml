name: Biconomy Docs MCP
status: live
description: >-
  Biconomy runs a hosted, anonymous-access MCP server on its documentation host. It is a
  DOCUMENTATION server, not an execution server: the three tools search, browse and give feedback
  on the docs corpus. None of them call the Supertransaction API — an agent can learn how to
  compose a supertransaction through MCP, but must then call POST /v1/quote and POST /v1/execute
  over REST with an X-API-Key. That gap is mapped in mcp/biconomy-tool-crosswalk.yml.
deployment:
  mode: remote
  endpoint: https://docs.biconomy.io/mcp
  auth: none
  verified: probed
  transport: streamable-http
  note: >-
    POST with Accept "application/json, text/event-stream" returns 200 and a text/event-stream
    body carrying the JSON-RPC result. https://docs.biconomy.io/mcp/ 308-redirects to /mcp.
    /sse on the same host answers 405, so the streamable-HTTP transport is the only binding.
    No stdio package is published — searched npm for a @biconomy MCP package and found none, so
    there is nothing to npx. mcp.biconomy.io does not resolve; api.biconomy.io/mcp returns 404.
