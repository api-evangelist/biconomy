gaps:
  - >-
    No MCP tool reaches the Supertransaction API. Quote composition, execution, orchestrator
    lookup, account upgrade and the instruction builders are all REST-only. An agent wanting to
    transact must leave MCP and hand-roll HTTP with a dashboard-issued X-API-Key.
  - >-
    The server is unauthenticated and therefore carries no identity — there is no OAuth
    authorization-server metadata and no protected-resource metadata on the host (both probed,
    404), so an MCP client cannot bind a user to a Biconomy project through this server.
