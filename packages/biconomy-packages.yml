description: >-
  First-party Biconomy client libraries. AbstractJS (@biconomy/abstractjs) is the current,
  actively-released TypeScript SDK and the one the docs and llms.txt point at. The @biconomy/*
  v3/v4 family (account, bundler, paymaster, modules, common, node-client, core-types, use-aa)
  and @biconomy/sdk are the superseded generations, all frozen since 2024/2025 — recorded here
  because a consumer landing on them from an old tutorial cannot otherwise tell they are dead.
  The @biconomy-devx/* scope is Biconomy's own pre-release channel, not a separate vendor.
  No first-party Python, Go, Java, Ruby, .NET or Rust client is published; the REST
  Supertransaction API is the documented path for non-TypeScript consumers.
