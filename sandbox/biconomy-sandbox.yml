testnet_sponsorship:
  published: true
  url: https://docs.biconomy.io/gasless-apps/testnet-sponsorship
  detail: >-
    A documented path to have gas sponsored on testnets so a developer can exercise the full
    gasless flow without funding accounts. This is the closest thing to a free sandbox tier.
simulation:
  published: true
  mechanism: >-
    `simulate` and `simulationOverrides` on POST /v1/quote, plus `fast-quote` mode for UI
    previews. MEE also simulates each step internally before committing it, which is the mechanism
    behind cross-chain waiting.
  detail: >-
    Lets a client rehearse a full plan — including against mainnet — without producing a signature
    or changing state. Functionally this is Biconomy's dry-run surface; see
    conventions/biconomy-conventions.yml.
absent:
  - Test card numbers or equivalent forced-outcome fixtures — not applicable to an on-chain API.
  - Test clocks / time simulation. `upperBoundTimestamp` bounds real time; it does not move it.
  - A fixture or trigger tool for driving webhook/event scenarios (there is no event surface).
  - Any published description of what api-staging.biconomy.io is for or who may use it.
