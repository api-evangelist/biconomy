provider: Biconomy
providerId: biconomy
description: >-
  Biconomy's test surface is the public EVM testnets rather than a vendor-simulated sandbox. There
  is no test-vs-live key prefix, no fixture generator, no test clock and no set of magic values
  that force a particular outcome — because the thing being tested is a real chain, and a testnet
  chain behaves like the real one. What Biconomy does provide is a staging API host, a documented
  testnet sponsorship path so gas is free while you develop, Nexus pre-deployed across a long list
  of testnets, and an in-band simulation mode that lets you rehearse against mainnet without
  signing.
modes:
  - name: production
    base_url: https://api.biconomy.io
    detail: Declared as "Production server" in servers[] of both published specs.
  - name: staging
    base_url: https://api-staging.biconomy.io
    detail: >-
      Declared as "Staging server" in servers[] of both published specs. Biconomy publishes no
      prose describing what staging guarantees, what data it holds, or whether the same API key
      works there — it is named in the contract and nowhere else.
    documented_in_prose: false
key_separation:
  test_live_prefixes: false
  detail: >-
    No separate test key. The documented key prefix is `mee_` with no mode marker, so a key cannot
    be inspected to tell whether it is pointed at test or live. Environment separation is by chain
    ID and by base URL, not by credential.
