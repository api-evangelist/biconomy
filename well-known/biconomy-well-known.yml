gaps:
  - >-
    No security.txt (RFC 9116) on any host — there is no machine-readable route to report a
    vulnerability in the API surface, despite Biconomy publishing four smart-contract audits.
  - >-
    No /.well-known/api-catalog (RFC 9727) on any host.
  - >-
    The www ai-plugin.json points api.url at https://docs.biconomy.io/openapi.json, which
    returns 404 "Asset not found". Biconomy's own machine-readable manifest names a dead spec
    URL; the working one is https://docs.biconomy.io/supertransaction-api/openapi.yaml, which
    the docs-host manifest names correctly. An agent that trusts the www manifest gets nothing.
  - >-
    No OAuth/OIDC metadata anywhere, consistent with the API using a static project-scoped
    X-API-Key rather than a delegated authorization flow.
