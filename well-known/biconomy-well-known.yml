description: >-
  Biconomy serves a real, hand-authored /.well-known/ surface on two of its hosts. www.biconomy.io
  and docs.biconomy.io each publish a distinct ai-plugin.json — the www one describes the company
  and its product surface, the docs one describes the Supertransaction API and its auth header —
  and docs.biconomy.io additionally serves an A2A agent card (captured separately under a2a/).
  No security.txt, OpenID configuration, OAuth metadata or RFC 9727 api-catalog is served on any
  host. Two caveats matter when reading the table below: www.biconomy.io is a single-page app that
  answers 200 with the same 10,969-byte shell for EVERY unknown path, so every text/html 200 on
  that host is a soft-404 and is recorded as a miss; dashboard.biconomy.io rate-limited the probe
  and returned 429 on every path, so its /.well-known/ surface is unmeasured rather than absent.
